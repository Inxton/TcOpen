name: dev

on: 
  push:
    branches: 
      - dev
  pull_request: 
    paths:
      - 'src/**'
      - 'pipelines/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      publishPackages:
        description: 'Set to "true" if packages should be published (runs the Release build); otherwise, leave as "false"'
        required: false
        default: 'false'

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
    runs-on: self-hosted    
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v3
        with:
          path: '.'
          fetch-depth: 0

      - name: Build Test Package
        if: ${{ github.event.inputs.publishPackages != 'true' }}
        env:        
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USER: ${{ secrets.GH_USER }}
        run: >
          .\pipelines\runbuild.ps1 -properties @{
            "buildConfig" = "Release";
            "updateAssemblyInfo" = $true;
            "testingStrength" = 1;
            "isTestingEnabled" = $true;
            "packNugets" = $false;
            "publishNugets" = $false; 
          }

      - name: Build Test Package Release
        if: ${{ github.event.inputs.publishPackages == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USER: ${{ secrets.GH_USER }}
          NUGET_TCOPEN : ${{ secrets.NUGET_TCOPEN }}
        run: >
          .\pipelines\runbuild.ps1 -properties @{
            "buildConfig" = "Release";
            "updateAssemblyInfo" = $true;
            "testingStrength" = 10;
            "isTestingEnabled" = $true;
            "packNugets" = $true;
            "publishNugets" = $true;
            "nugetToken" = ${{ env.NUGET_TCOPEN }};
            "nugetSource" = "https://api.nuget.org/v3/index.json";
          }

      - name: Create Tag
        if: ${{ env.BuildNumber && success() && github.event_name != 'pull_request' }}
        run: |
          git config --global user.email "team@inxton.com"
          git config --global user.name "InxtonDev"
          $tag = "GH-${{ github.run_id }}-${{ env.BuildNumber }}"
          git tag $tag 
          git push --tags
        continue-on-error: true

