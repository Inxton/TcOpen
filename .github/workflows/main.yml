name: dev

on: 
  push:
    branches : 
      - dev
  pull_request: 
    paths:
      - 'src/**'
      - 'pipelines/**'
      - '.github/**'
  workflow_dispatch:    
    inputs:
      publish:
        type: boolean
        required: false
        default: false
        description: "Set to 'true' to publish packages"
jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
    runs-on: self-hosted    
    
    timeout-minutes: 240
    
    steps:
      - uses: actions/checkout@v3
        with :
          path : '.'
          fetch-depth: 0
      - name: Run Psake
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == false }}            
        env:        
          GH_TOKEN : ${{ secrets.GH_TOKEN  }}
          GH_USER : ${{ secrets.GH_USER  }}                 
        run: >
          .\pipelines\runbuild.ps1 -properties 
          @{
            "buildConfig" = "Release";
            "updateAssemblyInfo" = $true;
            "testingStrength" = 1;
            "isTestingEnabled" = $true;
            "packNugets" = $false;
            "publishNugets" = $false; 
            }
      - name: Run Psake with package release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == true }}            
        env:
          GH_TOKEN : ${{ secrets.GH_TOKEN  }}
          GH_USER : ${{ secrets.GH_USER  }}           
        run: >
          .\pipelines\runbuild.ps1 -properties 
          @{
            "buildConfig" = "Release";
            "updateAssemblyInfo" = $true;
            "testingStrength" = 10;
            "isTestingEnabled" = $true;
            "packNugets" = $true;
            "publishNugets" = $true;
            }    
      - name : Create Tag
        if : ${{ env.BuildNumber && success() && github.event_name != 'pull_request'}}
        run : |
          git config --global user.email "team@inxton.com"
          git config --global user.name "InxtonDev"
          $tag = "GH-${{github.run_id}}-${{env.BuildNumber}}"
          git tag $tag 
          git push --tags
        continue-on-error: true
