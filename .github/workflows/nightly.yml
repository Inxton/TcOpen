name: nightly

on: 
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v2
        with :
          path : '.'
          fetch-depth: 0
      - name: Run Psake
        env:         
          GH_TOKEN : ${{ secrets.GH_TOKEN  }}
          GH_USER : ${{ secrets.GH_USER  }}   
        run: >
          .\pipelines\runbuild.ps1 -properties 
          @{
            "buildConfig" = "Release";
            "updateAssemblyInfo" = $true;
            "isTestingEnabled" = $true;
            "testingStrength" = 10;
            "packNugets" = $true;
          }
      - name : Create Tag
        if : env.BuildNumber && success() && github.event_name != 'pull_request'
        run : |
          git config --global user.email "team@inxton.com"
          git config --global user.name "InxtonDev"
          $tag = "GH-${{github.run_id}}-${{env.BuildNumber}}"
          git tag $tag 
          git push --tags
        continue-on-error: true
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Test report
          path: '**/TestResults/*.xml'   
          reporter: dotnet-trx 
